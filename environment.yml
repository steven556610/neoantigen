# This environment.yml is for setting up CNNeoPP, a consensus framework for neoantigen prioritization.
# It includes all necessary dependencies and tools to run the pipeline and associated models.
name: cnneopp
channels:
  - conda-forge
  - defaults
dependencies:
  # -------------------------
  # Core (required)
  # -------------------------
  # Updated to Python 3.10 to support newer transformers and torch versions
  - python=3.10
  - pip

  # -------------------------
  # Core scientific stack
  # -------------------------
  # Removed strict version pinning to avoid conflicts with newer PyTorch
  - numpy>=1.21,<2.0.0
  - pandas>=1.3.0
  - scipy
  - scikit-learn>=1.0.0
  - imbalanced-learn

  # -------------------------
  # Data I/O
  # -------------------------
  - openpyxl
  - xlrd

  # Notebooks (required to run *.ipynb in models/)
  - notebook
  - ipykernel

  # -------------------------
  # Optional: visualization
  # -------------------------
  - matplotlib
  - seaborn
  - tqdm

  # -------------------------
  # pip packages
  # -------------------------
  - pip:
      - torch==2.3.1
      - torchvision==0.18.1
      - torchaudio==2.3.1
      - torchtext==0.18.0
      - transformers==4.46.3
      - tokenizers==0.20.3
      - huggingface-hub==0.29.1
      - safetensors==0.5.2