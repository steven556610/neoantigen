[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnneopp"
version = "0.1.0"
description = "A consensus framework for neoantigen prioritization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "CNNeoPP Contributors" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    "torchtext",
    "transformers",
    "tokenizers",
    "huggingface-hub",
    "safetensors",
    "numpy>=1.21,<2.0.0",
    "pandas>=1.3.0",
    "scipy",
    "scikit-learn>=1.0.0",
    "imbalanced-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "openpyxl",
    "joblib"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "flake8"
]
api = [
    "fastapi",
    "uvicorn",
    "pydantic"
]

[tool.setuptools.packages.find]
include = ["cnneopp*"]
